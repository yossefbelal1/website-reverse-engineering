<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Apex Studio</title>
  <meta name="description" content="Reach out to discuss your next digital product or architectural challenge.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-star">✦</span> Apex Studio</a>
      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/work">Work</a>
        <a href="/contact" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Start a Conversation</h1>
        <p class="lead">Tell us about your company, goals, and upcoming projects.</p>
      </div>
    </section>

    <section class="contact-section">
      <div class="container">
        <form class="contact-form" action="/contact" method="POST" style="max-width: 600px;">
          <div style="margin-bottom: 20px;">
            <label for="name" style="display: block; font-weight: 600; margin-bottom: 8px;">Your Name</label>
            <input type="text" id="name" name="name" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
          </div>
          <div style="margin-bottom: 20px;">
            <label for="email" style="display: block; font-weight: 600; margin-bottom: 8px;">Work Email</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
          </div>
          <div style="margin-bottom: 24px;">
            <label for="message" style="display: block; font-weight: 600; margin-bottom: 8px;">Project Details</label>
            <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc;"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Inquiry</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Apex Studio. All rights reserved.</p>
        <div class="footer-links">
          <a href="/">Home</a> | <a href="/about">About</a> | <a href="/work">Work</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
